<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#1FA85B">
  <meta name="description" content="Chanda Collector — offline-first group collection tracker. EN / हिंदी / Hinglish.">
  <title>Chanda Collector</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./fonts/mukta.css">
  <style>
    :root {
      /* Design Tokens from README */
      --green: #1FA85B;
      --green-deep: #178A4A;
      --green-tint: #E6F5EC;
      --green-confirmed-bg: #EAF7EF;
      --green-confirmed-border: #9FDCB7;
      --saffron: #E8A33D;
      --saffron-tint: #FBF0DC;
      --pending-row-bg: #FFFCF6;
      --pending-row-border: #F1E2C6;
      --pending-text: #B07A22;
      --wa-green: #25D366;
      --cream: #FAF8F4;
      --card-white: #FFFFFF;
      --ink: #211B14;
      --ink-alt: #2A2118;
      --ink-soft: #6B6157;
      --ink-muted: #857A6E;
      --card-border: #EFE6D8;
      --card-border-alt: #EAE1D4;
      --btn-border: #E5DCCE;
      --pad-border: #E9E0D2;
      --ring-open: #D9CEBC;
      --dot-inactive: #DACFBE;
      --toggle-track: #F1EADF;
      --progress-track: #EFE7D9;
      --ring-track: #F0E7D8;
      --wa-bubble: #DCF8C6;
      --scrim: rgba(33, 27, 20, 0.42);

      /* Shape & Spacing */
      --radius-card: 20px;
      --radius-btn: 18px;
      --radius-row: 16px;
      --radius-pill: 999px;
      --shadow-card: 0 6px 16px -12px rgba(40, 30, 15, 0.35);
      --shadow-selected: 0 8px 18px -10px rgba(31, 168, 91, 0.5);
      --shadow-primary: 0 12px 24px -10px rgba(31, 168, 91, 0.6);
      --shadow-wa: 0 12px 24px -10px rgba(37, 211, 102, 0.6);
      --font-main: 'Mukta', 'Noto Sans', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background: var(--cream);
      color: var(--ink-alt);
      font-family: var(--font-main);
      font-size: 16px;
      line-height: 1.35;
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 24px;
      gap: 16px;
      width: 100%;
    }

    /* Header row */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .screen-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
      margin: 0;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .back-btn {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 14px;
      background: var(--card-white);
      border: 1px solid var(--btn-border);
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: 800;
      color: var(--ink-alt);
      flex-shrink: 0;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 13px;
      background: var(--card-white);
      border: 1px solid var(--btn-border);
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* Language Toggle (A / अ / Aa) */
    .lang-toggle {
      display: inline-flex;
      background: var(--toggle-track);
      border-radius: var(--radius-pill);
      padding: 4px;
      gap: 2px;
      flex-shrink: 0;
    }

    .lang-seg {
      min-width: 38px;
      min-height: 38px;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: var(--ink-soft);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-seg.active {
      background: var(--green);
      color: #FFFFFF;
    }

    /* Screen 1: Language Pick */
    .lang-hero {
      text-align: center;
      padding-top: 8px;
    }

    .logo-tile {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: var(--green);
      display: grid;
      place-items: center;
      font-size: 38px;
      margin: 4px auto 14px;
      box-shadow: 0 10px 22px -8px rgba(31, 168, 91, 0.55);
    }

    .lang-card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }

    .lang-pick-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card-white);
      border: 2px solid var(--btn-border);
      border-radius: var(--radius-card);
      padding: 16px 18px;
      min-height: 92px;
      text-align: left;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .lang-pick-card.selected {
      border: 2.5px solid var(--green);
      box-shadow: var(--shadow-selected);
    }

    .lang-pick-tile {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      background: var(--toggle-track);
      color: #5B5249;
      display: grid;
      place-items: center;
      font-size: 29px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .lang-pick-card.selected .lang-pick-tile {
      background: var(--green-tint);
      color: var(--green);
    }

    .lang-pick-radio {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid var(--ring-open);
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .lang-pick-card.selected .lang-pick-radio {
      background: var(--green);
      border-color: var(--green);
      color: #FFFFFF;
    }

    /* Screen 2: Home Collection Cards */
    .collection-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .collection-card {
      width: 100%;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .collection-card-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .collection-type-icon {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: var(--saffron-tint);
      display: grid;
      place-items: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .collection-pct-chip {
      font-size: 14px;
      font-weight: 800;
      color: var(--green);
      background: var(--green-tint);
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
    }

    .collection-card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
    }

    .empty-card {
      background: var(--card-white);
      border: 1.5px dashed var(--btn-border);
      border-radius: var(--radius-card);
      padding: 32px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }

    /* Screen 3: Create Wizard */
    .wizard-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 2px 0;
    }

    .wizard-dot {
      width: 10px;
      height: 8px;
      border-radius: var(--radius-pill);
      background: var(--dot-inactive);
      transition: width 0.2s ease, background 0.2s ease;
    }

    .wizard-dot.active {
      width: 30px;
      background: var(--green);
    }

    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .type-tile {
      background: var(--card-white);
      border: 2px solid var(--btn-border);
      border-radius: var(--radius-card);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 118px;
      text-align: center;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .type-tile.selected {
      border: 2.5px solid var(--green);
      background: var(--green-tint);
      box-shadow: 0 8px 18px -12px rgba(31, 168, 91, 0.5);
    }

    .text-input {
      width: 100%;
      min-height: 54px;
      background: var(--card-white);
      border: 1.5px solid var(--btn-border);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      outline: none;
    }

    .text-input:focus {
      border-color: var(--green);
    }

    .amount-display-card {
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px 20px 22px;
      text-align: center;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mode-pill-group {
      display: inline-flex;
      background: var(--toggle-track);
      border-radius: var(--radius-pill);
      padding: 4px;
      gap: 4px;
    }

    .mode-pill {
      min-height: 44px;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .mode-pill.active {
      background: var(--green);
      color: #FFFFFF;
    }

    .amount-big {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: var(--green);
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .amount-caret {
      display: inline-block;
      width: 3px;
      height: 44px;
      background: var(--green);
      margin-left: 4px;
      border-radius: 2px;
      animation: blink 1.1s infinite;
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .numpad-key {
      height: 64px;
      min-height: 64px;
      background: var(--card-white);
      border: 1px solid var(--pad-border);
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 27px;
      font-weight: 800;
      color: var(--ink);
      box-shadow: 0 3px 8px -6px rgba(40, 30, 15, 0.3);
      user-select: none;
    }

    .numpad-key:active {
      background: var(--toggle-track);
    }

    .numpad-key.backspace {
      background: var(--toggle-track);
      border-color: transparent;
      font-size: 25px;
    }

    .people-source-row {
      display: flex;
      gap: 12px;
    }

    .source-btn {
      flex: 1;
      min-height: 84px;
      background: var(--card-white);
      border: 1.5px solid var(--btn-border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
    }

    .source-btn.active {
      background: var(--green-tint);
      border-color: #B8E2C8;
      color: var(--green-deep);
    }

    .draft-person-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-row);
      padding: 8px 12px;
      min-height: 60px;
    }

    .avatar-circle {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 50%;
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .remove-circle-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: #F4ECE0;
      color: #9A8B79;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .deadline-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--saffron-tint);
      border: 1.5px dashed var(--saffron);
      border-radius: var(--radius-row);
      padding: 12px 16px;
      min-height: 60px;
    }

    /* Screen 4 & 5: Collection Detail + Progress Ring + Person Rows + Mark Paid + Undo */
    .ring-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }

    .progress-ring {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: background 0.45s ease-out;
    }

    .progress-ring-inner {
      width: 152px;
      height: 152px;
      border-radius: 50%;
      background: var(--card-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(40, 30, 15, 0.06);
      padding: 8px;
      text-align: center;
    }

    .ring-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chip-paid {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-tint);
      color: var(--green);
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 800;
    }

    .chip-pending {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--saffron-tint);
      color: var(--pending-text);
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 800;
    }

    .person-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .person-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-row);
      padding: 10px 14px;
      min-height: 62px;
      width: 100%;
    }

    .person-row.pending {
      background: var(--pending-row-bg);
      border-color: var(--pending-row-border);
    }

    .person-row.just-paid {
      background: var(--green-confirmed-bg);
      border: 1.5px solid var(--green-confirmed-border);
    }

    .person-row-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      text-align: left;
      min-height: 44px;
    }

    .status-paid {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: var(--green);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .status-paid.pop {
      animation: pop 0.4s ease-out;
    }

    .status-pending {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: var(--saffron-tint);
      border: 3px solid var(--saffron);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .wa-circle {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: var(--wa-green);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .method-choice-row {
      display: flex;
      gap: 14px;
    }

    .method-tile {
      flex: 1;
      height: 96px;
      min-height: 96px;
      background: var(--card-white);
      border: 2px solid var(--btn-border);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 800;
    }

    .method-tile.cash-highlight {
      background: var(--green-tint);
      border-color: var(--green);
      color: var(--green-deep);
    }

    .undo-toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 96px;
      width: calc(100% - 32px);
      max-width: 408px;
      background: var(--ink);
      color: #FFFFFF;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5);
      z-index: 35;
    }

    .undo-btn {
      min-height: 44px;
      padding: 6px 16px;
      font-size: 16px;
      font-weight: 800;
      color: #7BE3A3;
      border: 1.5px solid #3C7A55;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Screen 6: Share / Nudge on WhatsApp */
    .wa-bubble-preview {
      background: var(--wa-bubble);
      border-radius: 18px 18px 18px 6px;
      padding: 16px;
      font-size: 16px;
      line-height: 1.5;
      color: #1B2A1B;
      box-shadow: 0 4px 12px -8px rgba(40, 30, 15, 0.3);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .upi-qr-row {
      display: flex;
      gap: 14px;
      align-items: stretch;
    }

    .upi-card {
      flex: 1;
      min-width: 0;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
      text-align: left;
    }

    .qr-card {
      width: 124px;
      min-width: 124px;
      background: var(--card-white);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qr-box {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      overflow: hidden;
      background: #FFFFFF;
    }

    .qr-box svg {
      width: 96px;
      height: 96px;
      display: block;
    }

    .summary-link-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #EEF4FF;
      border: 1px solid #CFE0FB;
      border-radius: 16px;
      padding: 12px 14px;
      min-height: 60px;
    }

    .copy-pill-btn {
      min-height: 44px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 800;
      color: #3D5FA8;
      background: #FFFFFF;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pending-queue-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
    }

    .queue-person-chip {
      min-height: 44px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: var(--card-white);
      border: 1.5px solid var(--btn-border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .queue-person-chip.current {
      border-color: var(--wa-green);
      background: var(--green-tint);
      color: var(--green-deep);
    }

    .queue-person-chip.nudged {
      opacity: 0.65;
      background: var(--toggle-track);
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      min-height: 62px;
      border-radius: var(--radius-btn);
      background: var(--green);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      box-shadow: var(--shadow-primary);
      padding: 12px 18px;
      text-align: center;
    }

    .btn-primary:active {
      background: var(--green-deep);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-wa {
      width: 100%;
      min-height: 62px;
      border-radius: var(--radius-btn);
      background: var(--wa-green);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      box-shadow: var(--shadow-wa);
      padding: 12px 18px;
      text-decoration: none;
      text-align: center;
    }

    .btn-secondary {
      width: 100%;
      min-height: 58px;
      border-radius: 16px;
      background: var(--card-white);
      color: var(--ink-alt);
      border: 2px solid var(--btn-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      padding: 10px 16px;
    }

    .bottom-bar {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Progress bar */
    .progress-track {
      height: 16px;
      background: var(--progress-track);
      border-radius: var(--radius-pill);
      overflow: hidden;
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: var(--radius-pill);
      transition: width 0.45s ease-out;
    }

    /* Bottom sheet + scrim */
    .scrim {
      position: fixed;
      inset: 0;
      background: var(--scrim);
      z-index: 40;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 440px;
      background: var(--cream);
      border-radius: 28px 28px 0 0;
      padding: 20px 22px 28px;
      box-shadow: 0 -12px 40px -10px rgba(40, 30, 15, 0.4);
    }

    .sheet-handle {
      width: 48px;
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--dot-inactive);
      margin: 0 auto 18px;
    }

    @media (max-width: 380px) {
      .screen {
        padding: 14px 14px 20px;
      }
      .screen-title {
        font-size: 21px;
      }
      .amount-big {
        font-size: 44px;
      }
    }
  </style>
</head>
